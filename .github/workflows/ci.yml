# CI from the first commit (decision D5, docs/log/2026-06-10.md).
# Activates automatically once the repo is pushed to GitHub.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual "run the perf batch" button (Actions tab → CI → Run workflow).
  workflow_dispatch:
  schedule:
    # Nightly extended fuzz run (04:00 UTC) — drives `fuzz-nightly` only.
    # Was weekly (`0 4 * * 1`) until v0.2 round-3 Task 5: BUG-47 was found
    # at i=642, past the per-PR depth of 400, by a manual gate run — the
    # job that would have caught it before the gate did ran 52 times a
    # year. "Every deeper run on 2026-08-09 found something" is the
    # argument for daily (docs/audit/gaps.md GAP-13).
    - cron: "0 4 * * *"
    # Nightly perf batch schedule at (03:00 UTC);
    # `nightly-bench` is gated on exactly this cron so the daily fuzz
    # schedule above never triggers the perf batch.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

# Least privilege by default (ci_plan.md section 3.4): a read-only token for every job.
# The only job that needs write — `nightly-bench`, which commits perf history —
# opts into `contents: write` locally (below).
permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install ALSA dev headers
        # cpal (hw-emulation feature, speaker peripheral) links against ALSA
        # on Linux; alsa-sys's build script needs alsa.pc via pkg-config.
        run: sudo apt-get install -y libasound2-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # --workspace: default-members is intentionally just "." (fast local
        # iteration, docs/plan/workspace-split.local.md) but CI must still
        # lint mimz-core/mimz-sim — they silently dropped out of this gate
        # for a day after the workspace split until this fix.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc (warnings are errors)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Tests
        # REQUIRE_IVERILOG turns a missing Icarus install into a hard
        # failure — CI must never silently skip the differential tests.
        # --workspace: see Clippy step above. MIMZ_PERF_GATE is deliberately
        # NOT set here — the counter-kernel throughput floor is too noisy for
        # a shared PR runner (BUG-33); it's enforced in `nightly-bench` only.
        run: cargo test --workspace --all-targets
        env:
          REQUIRE_IVERILOG: "1"
          # GAP-11: the differential fuzzers' in-source default is deliberately
          # shallow (20) so a local `cargo test` doesn't pay 3 process spawns
          # per seed. 400 is the depth that actually found BUG-42 (i=245) and
          # BUG-44 (i=201) — measured 76.9 s for the pair in debug, run
          # concurrently with the rest of the suite. `fuzz-nightly` goes deeper.
          # The ever-failed seed corpus replays at every depth regardless.
          MIMZ_DIFF_FUZZ_N: "400"
          MIMZ_DIFF_FUZZ_CLOCKED_N: "400"

      - name: Build
        run: cargo build --workspace

      - name: Compile benches (criterion harness must not bit-rot)
        # --no-run type-checks benches/compile.rs without timing anything —
        # microbench timings on shared runners are too noisy to gate on.
        run: cargo bench --no-run

  bench:
    name: mimz-bench correctness gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install ALSA dev headers
        # cpal (hw-emulation feature, speaker peripheral) links against ALSA
        # on Linux; alsa-sys's build script needs alsa.pc via pkg-config.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Run mimz-bench (exit code is the gate)
        # Non-zero on any accuracy/safety failure: goldens, 4-flavor
        # byte-identity, error fixtures, no-false-positives. --no-cov skips the
        # slow llvm-cov rerun; --no-icarus because the Icarus differential
        # layer is already hard-gated in `check` via REQUIRE_IVERILOG.
        # --history to a temp path so the gate never touches the committed
        # bench-history.jsonl (only the perf batch records history).
        run: >
          cargo run --release --bin mimz-bench --
          --no-cov --no-icarus
          --history "${{ runner.temp }}/bench-history.jsonl"

  nightly-bench:
    name: perf batch (manual / nightly)
    runs-on: ubuntu-latest
    # Manual dispatch, plus the perf cron IF re-enabled above. Gated on the exact
    # perf cron so the daily fuzz schedule never triggers the perf batch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    # Needed so the bot can commit the appended history back to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install ALSA dev headers
        # cpal (hw-emulation feature, speaker peripheral) links against ALSA
        # on Linux; alsa-sys's build script needs alsa.pc via pkg-config.
        run: sudo apt-get install -y libasound2-dev

      - name: Run mimz-bench batch (500 iterations)
        # Appends one line to the tracked bench-history.jsonl (present from the
        # checkout, or created on the first run).
        run: cargo run --release --bin mimz-bench -- --no-cov --iterations 500

      - name: Perf-baseline gate
        # The counter-kernel 1M cycle-events/sec floor (tests/sim.rs) is too
        # noisy to assert on every PR's shared runner, so `check` runs it
        # ungated. This dedicated perf job is the one place it's enforced —
        # same MIMZ_PERF_GATE opt-in-hard-fail convention as REQUIRE_IVERILOG.
        run: cargo test --release --test sim the_counter_kernel_clears_the_perf_baseline -- --nocapture
        env:
          MIMZ_PERF_GATE: "1"

      - name: Commit history to develop branch
        # `[skip ci]` so this bot push does NOT re-trigger the workflow.
        # Pushes to `develop` (unprotected) instead of the protected default branch.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop || git branch develop
          git checkout develop
          git add bench-history.jsonl
          git diff --staged --quiet || git commit -m "chore(bench): perf history ${GITHUB_SHA::7} [skip ci]"
          git push origin develop

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report
          path: |
            bench-report.html
            bench-report.json

  fuzz:
    name: fuzz smoke (eval + compile)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz / libFuzzer need nightly; the lib itself stays on stable.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed corpus from examples
        # Give libFuzzer a known-good starting corpus (flattened names so the
        # same base file across flavor folders doesn't collide).
        run: |
          for t in lex_parse_eval lex_parse_compile pretty_roundtrip translate_roundtrip; do
            mkdir -p "fuzz/corpus/$t"
            for f in $(find examples -name '*.mimz'); do cp "$f" "fuzz/corpus/$t/${f//\//_}"; done
          done

      - name: Smoke run (60s each; any panic / abort / timeout fails the job)
        # Run from the repo root — cargo-fuzz finds the ./fuzz crate itself.
        # Bounded so it gates PRs without dominating CI. A reproducer for any
        # crash is written under fuzz/artifacts/ and the non-zero exit fails the
        # job. The nightly `fuzz-nightly` job runs a longer batch.
        run: |
          cargo fuzz run lex_parse_eval -- -max_total_time=60 -rss_limit_mb=2048
          cargo fuzz run lex_parse_compile -- -max_total_time=60 -rss_limit_mb=2048
          cargo fuzz run pretty_roundtrip -- -max_total_time=60 -rss_limit_mb=2048
          cargo fuzz run translate_roundtrip -- -max_total_time=60 -rss_limit_mb=2048

  fuzz-nightly:
    name: fuzz (nightly extended)
    runs-on: ubuntu-latest
    # Nightly cron above, plus manual dispatch. Longer per-target budget than the
    # per-PR smoke; same crash-is-a-finding contract. Also carries the deep
    # kernel-vs-Icarus differential (GAP-11) — the only place seed depth goes
    # past the per-PR default.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Install Icarus Verilog
        # For the differential-fuzz step below. The libFuzzer targets do not
        # need it; the kernel-vs-Icarus differential does.
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install ALSA dev headers
        # cpal (hw-emulation feature, speaker peripheral) links against ALSA
        # on Linux; alsa-sys's build script needs alsa.pc via pkg-config.
        run: sudo apt-get install -y libasound2-dev

      - name: Seed corpus from examples
        run: |
          for t in lex_parse_eval lex_parse_compile pretty_roundtrip translate_roundtrip; do
            mkdir -p "fuzz/corpus/$t"
            for f in $(find examples -name '*.mimz'); do cp "$f" "fuzz/corpus/$t/${f//\//_}"; done
          done

      - name: Extended run (10 min each target)
        run: |
          cargo fuzz run lex_parse_eval -- -max_total_time=600 -rss_limit_mb=2048
          cargo fuzz run lex_parse_compile -- -max_total_time=600 -rss_limit_mb=2048
          cargo fuzz run pretty_roundtrip -- -max_total_time=600 -rss_limit_mb=2048
          cargo fuzz run translate_roundtrip -- -max_total_time=600 -rss_limit_mb=2048

      - name: Deep differential fuzz (kernel vs Icarus, 5000 seeds each)
        # GAP-11: the `check` job sets 400 each (the depth that found BUG-42
        # and BUG-44); this is the pass that reaches past it. --release because
        # 5000 x 2 seeds is dominated by compile+vvp, not by rustc's -O.
        # --nocapture so the failing seed reaches the log even though the
        # assert message already names it — the seed is the whole reproducer,
        # and it goes straight into tests/fixtures/fuzz-seeds/.
        run: >
          cargo test --release --test differential_fuzz matches_icarus
          -- --nocapture --test-threads 2
        env:
          REQUIRE_IVERILOG: "1"
          MIMZ_DIFF_FUZZ_N: "5000"
          MIMZ_DIFF_FUZZ_CLOCKED_N: "5000"

  audit:
    name: cargo audit (advisory gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies (ci_plan.md section "crate supply-chain audit gate")
        # Reads the committed Cargo.lock; non-zero exit on a RUSTSEC advisory or a
        # yanked crate. SHA-pinning + Dependabot cover the supply chain's first
        # half; this closes the "known-vulnerable crate" gap.
        run: cargo audit

  docs:
    name: markdown lint + format
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: Markdown format check
        run: npx --yes prettier --check "**/*.md"
